<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduAcademy</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background: #f5f7fb;
color: #1a1a2e;
line-height: 1.6;
}

/* Navbar */
.navbar {
background: white;
box-shadow: 0 2px 20px rgba(0,0,0,0.08);
position: sticky;
top: 0;
z-index: 1000;
}

.nav-container {
max-width: 1280px;
margin: 0 auto;
padding: 1rem 2rem;
display: flex;
justify-content: space-between;
align-items: center;
flex-wrap: wrap;
gap: 1rem;
}

.logo {
font-size: 1.8rem;
font-weight: 800;
text-decoration: none;
background: linear-gradient(135deg, #667eea, #764ba2);
-webkit-background-clip: text;
background-clip: text;
color: transparent;
}

.nav-links {
display: flex;
gap: 1.5rem;
align-items: center;
flex-wrap: wrap;
}

.nav-links a {
text-decoration: none;
color: #4a5568;
font-weight: 500;
transition: color 0.2s;
}

.nav-links a:hover {
color: #667eea;
}

.login-btn, .admin-btn {
background: linear-gradient(135deg, #667eea, #764ba2);
padding: 0.5rem 1.2rem;
border-radius: 25px;
color: white !important;
}

.logout-btn {
background: #ef4444;
border: none;
padding: 0.5rem 1.2rem;
border-radius: 25px;
color: white;
cursor: pointer;
font-weight: 500;
}

/* Hero Section */
.hero {
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
color: white;
padding: 5rem 2rem;
text-align: center;
}

.hero h1 {
font-size: 3.5rem;
margin-bottom: 1rem;
}

.hero p {
font-size: 1.3rem;
margin-bottom: 2rem;
}

.cta-button {
background: white;
color: #667eea;
padding: 0.8rem 2rem;
border-radius: 40px;
text-decoration: none;
font-weight: bold;
display: inline-block;
}

/* Features */
.features {
display: flex;
justify-content: center;
gap: 2rem;
padding: 4rem 2rem;
background: white;
flex-wrap: wrap;
}

.feature-card {
text-align: center;
padding: 2rem;
border-radius: 20px;
background: #f8f9fa;
width: 260px;
}

.feature-icon {
font-size: 3rem;
margin-bottom: 1rem;
}

/* Page Container */
.page-container {
max-width: 1280px;
margin: 2rem auto;
padding: 2rem;
background: white;
border-radius: 30px;
box-shadow: 0 5px 20px rgba(0,0,0,0.05);
}

.page-title {
text-align: center;
margin-bottom: 2rem;
color: #2d3748;
font-size: 2rem;
}

/* Search */
.search-filter {
display: flex;
gap: 1rem;
margin-bottom: 2rem;
flex-wrap: wrap;
justify-content: center;
}

.search-input {
flex: 1;
min-width: 250px;
padding: 0.8rem 1.2rem;
border: 1px solid #e2e8f0;
border-radius: 12px;
font-size: 1rem;
}

.search-btn {
background: linear-gradient(135deg, #667eea, #764ba2);
border: none;
padding: 0.8rem 1.8rem;
border-radius: 12px;
color: white;
cursor: pointer;
}

/* Grids */
.courses-grid, .my-courses-grid, .articles-grid, .certificates-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
gap: 2rem;
}

.course-card, .my-course-card, .article-card, .certificate-card {
background: #f8f9fa;
border-radius: 20px;
overflow: hidden;
padding: 1.5rem;
transition: transform 0.3s;
border: 1px solid #eef2f7;
}

.course-card:hover, .my-course-card:hover, .article-card:hover {
transform: translateY(-5px);
box-shadow: 0 15px 30px rgba(0,0,0,0.1);
}

.course-card h3, .my-course-card h3, .article-card h3 {
margin-bottom: 0.5rem;
}

.course-meta {
display: flex;
gap: 1rem;
margin: 0.8rem 0;
font-size: 0.85rem;
color: #718096;
}

.course-rating {
display: flex;
align-items: center;
gap: 0.5rem;
margin: 0.5rem 0;
}

.stars {
color: #fbbf24;
}

.view-btn, .continue-btn, .read-more-btn {
display: inline-block;
margin-top: 1rem;
padding: 0.5rem 1rem;
background: linear-gradient(135deg, #667eea, #764ba2);
color: white;
text-decoration: none;
border-radius: 20px;
text-align: center;
}

/* Course Detail */
.course-detail h1 {
font-size: 2rem;
margin-bottom: 1rem;
}

.course-detail-meta {
display: flex;
gap: 1.5rem;
margin: 1rem 0;
padding: 1rem 0;
border-top: 1px solid #e2e8f0;
border-bottom: 1px solid #e2e8f0;
color: #718096;
}

.enroll-btn-large {
display: block;
width: 100%;
max-width: 300px;
margin: 1rem auto;
padding: 1rem;
background: linear-gradient(135deg, #667eea, #764ba2);
border: none;
border-radius: 40px;
color: white;
font-size: 1.1rem;
cursor: pointer;
}

/* Lessons */
.lesson-item {
border: 1px solid #e2e8f0;
border-radius: 12px;
margin-bottom: 0.5rem;
overflow: hidden;
}

.lesson-header {
display: flex;
align-items: center;
gap: 1rem;
padding: 1rem;
background: #f8f9fa;
cursor: pointer;
}

.lesson-title {
flex: 1;
}

.lesson-content {
padding: 1.5rem;
border-top: 1px solid #e2e8f0;
background: white;
}

.video-content iframe {
width: 100%;
height: 400px;
border-radius: 12px;
}

/* Comments */
.add-comment {
background: #f8f9fa;
padding: 1.5rem;
border-radius: 20px;
margin-bottom: 2rem;
}

.comment-input {
width: 100%;
padding: 0.8rem;
border: 1px solid #e2e8f0;
border-radius: 12px;
}

.comment-item {
border-bottom: 1px solid #e2e8f0;
padding: 1rem 0;
}

/* Auth */
.auth-container {
display: flex;
justify-content: center;
align-items: center;
min-height: 70vh;
padding: 2rem;
}

.auth-card {
background: white;
padding: 2.5rem;
border-radius: 30px;
width: 100%;
max-width: 450px;
box-shadow: 0 20px 40px rgba(0,0,0,0.1);
}

.auth-card h2 {
text-align: center;
margin-bottom: 1.5rem;
}

.auth-input {
width: 100%;
padding: 0.8rem;
margin: 0.5rem 0;
border: 1px solid #e2e8f0;
border-radius: 12px;
}

.auth-btn {
width: 100%;
padding: 0.8rem;
background: linear-gradient(135deg, #667eea, #764ba2);
border: none;
border-radius: 12px;
color: white;
font-size: 1rem;
cursor: pointer;
margin-top: 1rem;
}

.auth-footer {
text-align: center;
margin-top: 1.5rem;
}

.auth-footer a {
color: #667eea;
text-decoration: none;
}

/* Profile */
.profile-card {
max-width: 600px;
margin: 0 auto;
text-align: center;
}

.profile-avatar {
font-size: 5rem;
margin-bottom: 1rem;
}

.form-group {
margin-bottom: 1rem;
text-align: left;
}

.form-group label {
display: block;
margin-bottom: 0.3rem;
}

.form-group input {
width: 100%;
padding: 0.8rem;
border: 1px solid #e2e8f0;
border-radius: 12px;
}

.save-btn {
background: linear-gradient(135deg, #667eea, #764ba2);
border: none;
padding: 0.8rem 1.5rem;
border-radius: 25px;
color: white;
cursor: pointer;
}

/* Progress */
.progress-bar {
background: #e2e8f0;
border-radius: 20px;
height: 8px;
overflow: hidden;
margin: 0.5rem 0;
}

.progress-fill {
background: linear-gradient(135deg, #667eea, #764ba2);
height: 100%;
width: 65%;
}

/* Messages */
.error {
color: #e53e3e;
background: #fff5f5;
padding: 1rem;
border-radius: 12px;
text-align: center;
}

.error-msg {
background: #fed7d7;
color: #c53030;
padding: 0.8rem;
border-radius: 10px;
margin-top: 1rem;
text-align: center;
}

.success-message {
background: #c6f6d5;
color: #276749;
padding: 0.8rem;
border-radius: 10px;
margin-top: 1rem;
text-align: center;
}

.loading {
text-align: center;
padding: 3rem;
color: #718096;
}

.empty-state {
text-align: center;
padding: 3rem;
color: #718096;
}

/* Footer */
.footer {
background: #1a1a2e;
color: #a0aec0;
margin-top: 3rem;
padding: 3rem 2rem 1rem;
}

.footer-columns {
max-width: 1280px;
margin: 0 auto;
display: grid;
grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
gap: 2rem;
margin-bottom: 2rem;
}

.footer-col h4 {
color: white;
margin-bottom: 1rem;
}

.footer-col a {
display: block;
color: #a0aec0;
text-decoration: none;
margin-bottom: 0.5rem;
}

.copyright {
text-align: center;
padding-top: 2rem;
border-top: 1px solid #2d3748;
}

/* Responsive */
@media (max-width: 768px) {
.hero h1 {
font-size: 2rem;
}

.courses-grid, .my-courses-grid, .articles-grid {
grid-template-columns: 1fr;
}

.video-content iframe {
height: 250px;
}
}
</style>
</head>
<body>
<div id="root"></div>
</body>
</html>
